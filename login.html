<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Centro Médico Ollantay - Inicio de sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}"/>
</head>
<body>
<div class="login-wrap">
    <div class="login-logo">
        <img th:src="@{/img/logo.png}" alt="Centro Médico Ollantay"/>
    </div>

    <div class="login-card">
        <h2>Iniciar sesión</h2>

        <div class="aviso aviso-error" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>
        <div class="aviso aviso-ok" th:if="${param.salio}">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <label>Usuario:</label>
            <input type="text" name="username" autofocus/>
            <label>Contraseña:</label>
            <input type="password" name="password"/>
            <button class="btn" type="submit" style="width:100%; margin-top:16px;">Ingresar</button>
        </form>
    </div>

    <div class="suave" th:text="'Sistema de Historias Clínicas  -  ' + ${#dates.format(#dates.createNow(),'yyyy')}">
        Sistema de Historias Clínicas
    </div>
</div>
</body>
</html>
