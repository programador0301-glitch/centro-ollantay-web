# ===== Configuración para la NUBE (perfil "prod") =====
# Este archivo se usa SOLO cuando la app corre en el servidor (Render).
# Obliga a conectarse a PostgreSQL (Neon) usando las variables de entorno.
# NO tiene base temporal de respaldo: si faltan las variables de Neon,
# la app NO arranca y avisa con un error, en vez de guardar en un lugar
# que se borra. Así los datos NUNCA se pierden por accidente.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
