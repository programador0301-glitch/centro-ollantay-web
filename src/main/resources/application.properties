# ===== Puerto =====
# En la nube, el hosting indica el puerto con la variable PORT; en tu PC usa 8080.
server.port=${PORT:8080}

# ===== Base de datos =====
# Si existen las variables de entorno (en la nube) usa PostgreSQL;
# si no, usa H2 en archivo (en tu PC, sin instalar nada).
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/centro_ollantay;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas solas (funciona igual en H2 y PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Formato de fecha para el formulario (fecha de nacimiento)
spring.mvc.format.date=yyyy-MM-dd

# La consola H2 queda desactivada (no se usa en la nube)
spring.h2.console.enabled=false
