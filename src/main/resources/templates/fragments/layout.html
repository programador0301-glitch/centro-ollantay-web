<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<!-- Cabecera + navegación. Se usa con: th:replace="~{fragments/layout :: cabecera('pacientes')}" -->
<div th:fragment="cabecera(activo)">
    <div class="header">
        <div class="marca">
            <img th:src="@{/img/logo.png}" alt="Logo"/>
            <div>
                <div class="t1">Centro Médico Ollantay</div>
                <div class="t2">Sistema de Historias Clínicas</div>
            </div>
        </div>
        <div class="usuario">
            <span>👤 <b th:text="${usuarioActual}">usuario</b>
                  <span th:text="${esAdmin} ? '(ADMIN)' : '(USUARIO)'">(ROL)</span></span>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button class="btn btn-gris" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
    <div class="nav">
        <a th:href="@{/pacientes}" th:classappend="${activo=='pacientes'} ? 'activo' : ''">Pacientes</a>
        <a th:href="@{/pacientes/resumen}" th:classappend="${activo=='resumen'} ? 'activo' : ''">Resumen</a>
        <a th:if="${esAdmin}" th:href="@{/usuarios}" th:classappend="${activo=='usuarios'} ? 'activo' : ''">Usuarios</a>
    </div>
</div>
</body>
</html>
